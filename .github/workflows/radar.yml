name: Sidequest-Radar

on:
  schedule:
    - cron: "17 */3 * * *"   # alle 3 Stunden, Minute 17 (UTC)
  workflow_dispatch:          # Knopf "Run workflow" fuer Probelaeufe

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Radar laufen lassen
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 radar.py

      - name: Ergebnis sichern (haelt den Zeitplan wach)
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar.md radar.json verlauf.csv 2>/dev/null || true
          git commit -m "Radar $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nichts neu"
          git push
